<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop POS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/pos.css">
    <link rel="stylesheet" href="css/kiosk.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Kiosk Header (Only for Kiosk Mode) -->
    <header class="kiosk-header hidden" id="kiosk-header">
        <div class="kiosk-brand">
            <button class="menu-toggle" onclick="app.toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <i class="fas fa-coffee"></i>
            <span>Coffee Shop</span>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar hidden" id="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="fas fa-coffee" style="margin-right: 10px;"></i>
                    COFFEE POS
                </div>
            </div>

            <div style="flex: 1;">
                <a href="#" class="nav-link active" onclick="app.navigate('pos'); return false;" id="nav-pos">
                    <i class="fas fa-cash-register"></i>
                    <span>POS (Kiosk)</span>
                </a>
                <a href="#" class="nav-link" onclick="app.navigate('inventory'); return false;" id="nav-inventory">
                    <i class="fas fa-box-open"></i>
                    <span>Inventory</span>
                </a>
                <a href="#" class="nav-link" onclick="app.navigate('reports'); return false;" id="nav-reports">
                    <i class="fas fa-chart-line"></i>
                    <span>Reports</span>
                </a>
                <a href="#" class="nav-link" onclick="app.navigate('history'); return false;" id="nav-history">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <a href="#" class="nav-link" onclick="app.logout(); return false;">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content" id="main-view">
            <!-- Views will be injected here by app.js -->
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" id="modal-container">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/views/login.js"></script>
    <script src="js/views/pos.js"></script>
    <script src="js/views/inventory.js"></script>
    <script src="js/views/reports.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
