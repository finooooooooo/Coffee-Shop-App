<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop POS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/pos.css">
    <link rel="stylesheet" href="css/kiosk.css"> <!-- New CSS -->
    <link rel="stylesheet" href="css/login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Kiosk Header (Initially hidden, shown in POS mode) -->
    <header class="kiosk-header hidden" id="kiosk-header">
        <div class="kiosk-brand">
            <button class="menu-toggle" onclick="app.toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <i class="fas fa-coffee"></i>
            <span>Coffee Shop Cafe and Restaurant</span>
        </div>
        <!-- Optional: User profile or time -->
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar hidden">
        <!-- Sidebar Navigation (Hidden by default in Kiosk mode) -->
        <nav class="sidebar hidden" id="app-sidebar">
            <div class="brand">
                <i class="fas fa-coffee"></i>
                <span>COFFEE POS</span>
            </div>
            <ul class="nav-links">
                <li class="active" onclick="app.navigate('pos')">
                    <i class="fas fa-cash-register"></i>
                    <span>POS (Kiosk)</span>
                </li>
                <li onclick="app.navigate('inventory')">
                    <i class="fas fa-box-open"></i>
                    <span>Inventory</span>
                </li>
                <li onclick="app.navigate('reports')">
                    <i class="fas fa-chart-line"></i>
                    <span>Reports</span>
                </li>
                <li onclick="app.navigate('history')">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </li>
            </ul>
            <div class="user-profile">
                <div class="shift-status" id="shift-status-display">
                    <div class="indicator red"></div>
                    <span>Shift Closed</span>
                </div>
                <button class="btn-shift" onclick="pos.toggleShift()">Toggle Shift</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content" id="main-view">
            <!-- Views will be injected here by app.js -->
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" id="modal-container">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/views/login.js"></script>
    <script src="js/views/pos.js"></script>
    <script src="js/views/inventory.js"></script>
    <script src="js/views/reports.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
