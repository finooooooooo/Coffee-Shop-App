<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop POS</title>
    <!-- Global Error Handler -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorContainer = document.createElement('div');
            errorContainer.style.position = 'fixed';
            errorContainer.style.top = '0';
            errorContainer.style.left = '0';
            errorContainer.style.width = '100%';
            errorContainer.style.backgroundColor = '#ff4444';
            errorContainer.style.color = 'white';
            errorContainer.style.padding = '10px';
            errorContainer.style.zIndex = '9999';
            errorContainer.style.fontFamily = 'monospace';
            errorContainer.innerText = `Error: ${message}\nSource: ${source}:${lineno}:${colno}`;
            document.body.appendChild(errorContainer);
            console.error('Global Error:', error);
        };
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Main Container -->
    <div id="main-view" class="app-container">
        <!-- Views will be injected here -->
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" id="modal-container">
            <!-- Modal content -->
        </div>
    </div>

    <!-- Quick Action Menu -->
    <div id="quick-action-overlay" class="quick-action-overlay" onclick="app.closeQuickActions()"></div>
    <div id="quick-action-menu" class="quick-action-menu">
        <!-- Content injected by JS -->
    </div>

    <!-- Scripts -->
    <script src="js/views/login.js"></script>
    <script src="js/views/pos.js"></script>
    <script src="js/views/inventory.js"></script>
    <script src="js/views/reports.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
